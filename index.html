<style>
:root{--spring:cubic-bezier(.34,1.35,.64,1)}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.reveal .slides>section{padding:0!important;margin:0;text-align:left}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;container-type:size;color:#fff;--ink:#fff;--bg:#000}
.stage.L{color:#111;--ink:#111;--bg:#fff}
#fl{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:99;mix-blend-mode:screen}
.stage *{box-sizing:border-box;margin:0}
.a{position:absolute;translate:-50% -50%}
.g{position:absolute;left:50%;top:50%;width:0;height:0}
.reveal .stage img{position:absolute;display:block;max-width:none;max-height:none;margin:0;border:0;box-shadow:none;background:none}
.reveal .stage img.big{max-width:80%;max-height:80%}
.reveal .stage img.ph{border:.4cqmin dashed rgba(128,128,128,.7);border-radius:1.2cqmin}
.ph{width:40cqmin;height:40cqmin}
.big.ph{width:60cqmin;height:45cqmin}
.dg{object-fit:contain;animation:appear .6s var(--spring) both}
.bd{position:absolute;left:0;top:0;translate:-50% -50%;width:63cqmin;height:63cqmin;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);gap:.9cqmin;background:#fff}
.bd div{background:color-mix(in srgb,var(--c) 38%,#000)}
.bd.full div{background:var(--c)}
.mk{width:15cqmin;height:15cqmin;border:0 solid #fff;transition:width .6s var(--spring),height .6s var(--spring),background .8s,border-radius .6s,border-width .6s,box-shadow .8s,filter .6s}
.x::before,.x::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:2.2cqmin;background:#fff;border-radius:1cqmin;translate:-50% -50%;rotate:45deg;transition:opacity .4s}
.x::after{rotate:-45deg}
.o{border-width:2.2cqmin;border-radius:50%}
.mk.ball{width:11cqmin;height:11cqmin;background:var(--c);border-width:.7cqmin;border-radius:50%}
/* bloom (dark slides only) */
.stage:not(.L) .x,.stage:not(.L) .o{filter:drop-shadow(0 0 1.4cqmin rgba(255,255,255,.55))}
.stage:not(.L) .mk.ball{filter:none;box-shadow:0 0 3.2cqmin color-mix(in srgb,var(--c) 75%,transparent)}
.ball::before,.ball::after{opacity:0}
.fire{position:absolute;left:50%;top:48%;translate:-50% -50%;font-size:13cqmin;line-height:1;animation:fire .45s infinite;filter:drop-shadow(0 0 1.6cqmin #ff8a00)}
.st{position:absolute;height:1.8cqmin;background:#fff;border-radius:1cqmin;translate:-50% -50%;box-shadow:0 0 1.2cqmin #fff,0 0 4cqmin rgba(255,255,255,.6);transition:opacity .8s}
.tl{position:absolute;left:12cqw;width:76cqw;top:50%;height:.7cqmin;background:#fff;opacity:.35;translate:0 -50%;box-shadow:0 0 2cqmin rgba(255,255,255,.5)}
.ic{width:12cqmin;height:12cqmin}.ic svg{width:100%;height:100%}
.rb{font-size:15cqmin;line-height:1}.reveal .stage .rb img{position:static;height:17cqmin}
.gw{overflow:hidden;background:#111;box-shadow:0 0 0 .5cqmin var(--ink);z-index:0}
.reveal .stage img.im{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0}
.gr{position:absolute;inset:0;display:grid}
.gr div{border:1px solid rgba(255,255,255,.55)}
.cr{border:.5cqmin solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:system-ui,sans-serif;font-weight:600;background:var(--bg);z-index:2;transition:all .25s var(--spring)}
.stage:not(.L) .cr{box-shadow:0 0 2.2cqmin rgba(255,255,255,.22)}
.stage:not(.L) .cr.lit{box-shadow:0 0 5cqmin var(--ink),0 0 12cqmin rgba(255,255,255,.35)}
.cr.lit{background:var(--ink);color:var(--bg);box-shadow:0 0 4cqmin var(--ink)}
.ov{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.ln{stroke:var(--ink);opacity:calc(.07 + var(--w,.3)*.3);stroke-width:calc(.5px + var(--w,.3)*1.4px);transition:all .6s}
.ln.z{opacity:0}.ln.dim{opacity:calc(.03 + var(--w,.3)*.1)}.L .ln.dim{opacity:calc(.1 + var(--w,.3)*.3)}
.ln.hi{opacity:.95;stroke-width:calc(2px + var(--w,1)*3.2px)}
.ln.g{stroke:#1fbf5f;opacity:1;stroke-width:calc(2px + var(--w,1)*3.2px)}.ln.r{stroke:#e02424;opacity:1;stroke-width:calc(2px + var(--w,1)*3.2px)}
.mp{fill:var(--ink)}
.sq{width:42cqmin;height:42cqmin;border:.9cqmin solid var(--ink);border-radius:1.6cqmin}
.gr div{transition:background .9s}.gr div.dk{background:rgba(0,0,0,.88)}
.mb{position:absolute;translate:-50% -50%;width:14.2cqmin;height:14.2cqmin;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);gap:.35cqmin;background:#fff;animation:appear .9s var(--spring) both}
.mb div{position:relative;background:color-mix(in srgb,var(--c) 38%,#000)}
.mb i{position:absolute;inset:0}
.mb i::before,.mb i::after{content:"";position:absolute;left:50%;top:50%;width:78%;height:14%;background:#fff;border-radius:99px;translate:-50% -50%;rotate:45deg}
.mb i::after{rotate:-45deg}
.ar{position:absolute;height:1.1cqmin;background:#1fbf5f;border-radius:1cqmin;opacity:.7;transition:width .1s linear}
.ar::after{content:"";position:absolute;right:-2.6cqmin;top:50%;translate:0 -50%;border-left:3cqmin solid #1fbf5f;border-top:2.2cqmin solid transparent;border-bottom:2.2cqmin solid transparent}
@keyframes pop{from{scale:0}}
@keyframes zoom{from{scale:.4;opacity:0}}
@keyframes grow{from{scale:0 1}}
@keyframes appear{from{opacity:0;scale:.3}}
@keyframes fire{50%{scale:1.15 1.35;rotate:5deg}0%,100%{rotate:-5deg}}
@keyframes drift{from{translate:-2.5cqmin 1.5cqmin;rotate:-5deg}to{translate:2.5cqmin -1.5cqmin;rotate:5deg}}
</style></head><body>

<script>
const fl=document.getElementById('fl'),NS='http://www.w3.org/2000/svg';
let S,cur=0,tm=[],stages=[];
const T=(f,ms)=>{tm.push(setTimeout(f,ms))},I=(f,ms)=>tm.push(setInterval(f,ms));
const clr=()=>{tm.forEach(i=>{clearTimeout(i);clearInterval(i)});tm=[]};
const rnd=n=>Math.floor(Math.random()*n);
function el(t,c,p,st){const e=document.createElement(t);if(c)e.className=c;if(st)Object.assign(e.style,st);(p||S).appendChild(e);return e}
function pic(src,cls,st,p){const i=el('img',cls,p,st);i.onerror=()=>{i.removeAttribute('src');i.classList.add('ph')};i.src=src;return i}
const pic1=(src,x='50%')=>pic(src,'a big',{left:x,top:'50%'});
const GREEN='#1fbf5f',RED='#e02424';
/* one spring for everything (slight overshoot); falls back to a cubic-bezier overshoot if linear() is unsupported */
const SPR=(window.CSS&&CSS.supports&&CSS.supports('animation-timing-function','linear(0,1)'))?'linear(0,.22 6%,.62 12%,.9 18%,1.05 25%,1.09 30%,1.05 37%,.99 47%,.985 57%,1.003 72%,1)':'cubic-bezier(.34,1.35,.64,1)';

/* vignette: smoothstep falloff (no visible ring) + a soft inset edge glow, blended as light (screen) */
const vig=(c,a=55)=>'radial-gradient(ellipse closest-side at 50% 50%,'+[0,.2,.4,.6,.8,1].map(t=>{const k=t*t*(3-2*t);return `color-mix(in srgb,${c} ${(k*85).toFixed(0)}%,transparent) ${(a+(108-a)*t).toFixed(0)}%`}).join(',')+')';

 fl.animate([{opacity:0,easing:'cubic-bezier(.2,.8,.3,1)'},{opacity:Math.min(1,o*1.8),offset:Math.min(.25,70/ms),easing:'cubic-bezier(.3,0,.7,1)'},{opacity:0}],{duration:ms})}

/* ---------- tic-tac-toe ---------- */
const COL=['#e6194b','#f58231','#ffe119','#3cb44b','#42d4f4','#4363d8','#911eb4','#f032e6','#bdbdbd'];
const cx=i=>(i%3-1)*21,cy=i=>(Math.floor(i/3)-1)*21;
const BAD=[[8,'x'],[4,'o'],[1,'x'],[3,'o'],[0,'x'],[5,'o']],BW=[3,4,5];
const GOOD=[[4,'x'],[1,'o'],[0,'x'],[8,'o'],[6,'x'],[3,'o'],[2,'x']],GW=[2,4,6];
function board(g,full){const b=el('div','bd'+(full?' full':''),g);COL.forEach(c=>el('div','',b).style.setProperty('--c',c))}
function mark(g,i,t,pop){const m=el('div','a mk '+t,g,{left:cx(i)+'cqmin',top:cy(i)+'cqmin'});m.style.setProperty('--c',COL[i]);if(pop)m.style.animation='pop .45s var(--spring)';return m}
function strike(g,w,anim,dl=0){const a=w[0],c=w[2],dx=cx(c)-cx(a),dy=cy(c)-cy(a);return el('div','st',g,{left:(cx(a)+cx(c))/2+'cqmin',top:(cy(a)+cy(c))/2+'cqmin',width:Math.hypot(dx,dy)+10+'cqmin',rotate:Math.atan2(dy,dx)+'rad',animation:anim?`grow .5s ease-out ${dl}ms both`:'none'})}
/* the machine's move: a bead in the cell's color comes out of the open box, flies to the cell and morphs into the X */
function fly(g,m,i,Z){const bx=pic('assets/matchbox-open.png','a',{left:'15cqw',top:'50%',width:'34cqmin',opacity:0,transition:'opacity .5s'});
 m.classList.add('ball');T(()=>bx.style.opacity=1,Z);
 /* shake the box, then a bead comes out */
 const tr=d=>`calc(-50% + ${d}cqmin) -50%`;
 bx.animate([{rotate:'0deg',translate:tr(0)},{rotate:'-9deg',translate:tr(-.8)},{rotate:'8deg',translate:tr(.8)},{rotate:'-7deg',translate:tr(-.6)},{rotate:'6deg',translate:tr(.5)},{rotate:'-3deg',translate:tr(-.2)},{rotate:'0deg',translate:tr(0)}],{duration:650,delay:Z+350,easing:'ease-in-out'});
 m.animate([{left:'-35cqw',top:'0cqmin',scale:.3,opacity:0,filter:'blur(0px)',offset:0},
  {left:`calc(-17.5cqw + ${cx(i)/2}cqmin)`,top:cy(i)/2-14+'cqmin',scale:1,opacity:1,filter:'blur(2.4px)',offset:.5},
  {left:cx(i)+'cqmin',top:cy(i)+'cqmin',scale:1,opacity:1,filter:'blur(0px)',offset:1}],{duration:1000,delay:Z+1000,easing:'ease-in-out',fill:'backwards'});
 T(()=>m.classList.remove('ball'),Z+2050);T(()=>bx.style.opacity=0,Z+2700)}
function game(M,k,w,o={}){const g=el('div','g');if(o.zoom)g.style.animation='zoom .9s var(--spring)';board(g,o.full);
 const last=k>0&&M[k-1],bead=!!(o.bead&&last&&last[1]=='x'),Z=o.zoom?800:0;
 const mk=M.slice(0,k).map(([i,t],j)=>mark(g,i,t,o.pop!==0&&j==k-1&&!bead));
 if(bead)fly(g,mk[k-1],last[0],Z);
 /* the winning line animates only on the winning move; on every later slide it is simply there */
 const st=(w&&k==M.length)?strike(g,w,o.pop!==0,bead?Z+2700:0):null;return{g,mk,st}}
const PITCH=23,STEP=3.3,COLX=52;
const colPos=(j,n)=>[COLX+'cqmin',(j-(n-1)/2)*PITCH+5+'cqmin'];
/* mode 0: X's turn into balls, then glide to a column; 1: end state on fire; 2: end state only */
function morph(M,w,mode){const xWin=M[M.length-1][1]=='x';
 const r=game(M,M.length,(xWin&&mode)?null:w,{pop:0});
 const xs=r.mk.filter((m,j)=>M[j][1]=='x'),n=xs.length;
 if(mode==0){
  T(()=>{xs.forEach(m=>m.classList.add('ball'));if(xWin&&r.st)r.st.style.opacity=0},400);
  xs.forEach((m,j)=>T(()=>{const[l,t]=colPos(j,n),from={left:m.style.left,top:m.style.top};
   m.style.left=l;m.style.top=t;
   m.animate([{...from,filter:'blur(0px)'},{offset:.4,filter:'blur(2.4px)'},{left:l,top:t,filter:'blur(0px)'}],{duration:1500,easing:'cubic-bezier(.45,0,.2,1)',fill:'backwards'})},1100+j*170))
 }else xs.forEach((m,j)=>{const[l,t]=colPos(j,n);m.classList.add('ball');m.style.left=l;m.style.top=t;
  if(mode==1){el('div','fire',m).textContent='🔥';T(()=>{m.style.background='#1a1a1a';m.style.boxShadow='none'},1400)}});
 return{r,xs,n}}
/* three more balls drop onto each ball and heap up into a small pile */
function piles(){const{r,xs,n}=morph(GOOD,GW,2),dx=[1.2,-1.4,.8];
 xs.forEach((m,j)=>[1,2,3].forEach(k=>T(()=>{
  const y=(j-(n-1)/2)*PITCH+5-k*STEP+'cqmin',y2=(j-(n-1)/2)*PITCH+5-k*STEP-1.6+'cqmin';
  const b=el('div','a mk ball',r.g,{left:COLX+dx[k-1]+'cqmin',top:y});
  b.style.setProperty('--c',m.style.getPropertyValue('--c'));
  b.animate([{top:'-62cqh',scale:'.88 1.35',filter:'blur(2.4px)',offset:0,easing:'cubic-bezier(.5,0,1,.6)'},{scale:'.88 1.35',filter:'blur(2.4px)',offset:.72},{top:y,scale:'1 1',filter:'blur(0px)',offset:.78,easing:'ease-out'},{top:y2,offset:.88,easing:'ease-in'},{top:y,offset:1}],{duration:850})
 },600+(j*3+k-1)*330)))}

/* ---------- reward track ---------- */
const CK='<svg viewBox="0 0 24 24"><path d="M3 12.5l6 6L21 6" stroke="#1fbf5f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const XX='<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#e02424" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>';
function setRob(r,p,ms){r.style.transition=ms?`left ${ms}ms var(--spring)`:'none';r.style.left=`calc(12cqw + ${p*.76}cqw)`}
const RGLOW='drop-shadow(0 0 2cqmin rgba(255,255,255,.35))';
function trk(){el('div','tl');el('div','a ic',null,{left:'91cqw',top:'50%',filter:`drop-shadow(0 0 2cqmin ${GREEN})`}).innerHTML=CK;el('div','a ic',null,{left:'9cqw',top:'50%',filter:`drop-shadow(0 0 2cqmin ${RED})`}).innerHTML=XX;
 const r=el('div','a rb',null,{top:'50%',filter:RGLOW});const i=el('img','',r);i.onerror=()=>{i.remove();r.textContent='🤖'};i.src='assets/robot.png';setRob(r,50,0);return r}
function lone(i,c){const g=el('div','g');board(g);mark(g,i,'x',1);T(()=>flash(c,.5,1100),500)}

/* ---------- network (all coordinates in the 1920x1080 stage space) ---------- */
function rc(e){const sr=S.getBoundingClientRect(),k=sr.width/1920||1,r=e.getBoundingClientRect();
 return{l:(r.left-sr.left)/k,r:(r.right-sr.left)/k,t:(r.top-sr.top)/k,b:(r.bottom-sr.top)/k}}
const ctr=e=>{const q=rc(e);return[(q.l+q.r)/2,(q.t+q.b)/2]};
const BLOOM_LINES=true;
function svg(){const v=document.createElementNS(NS,'svg');v.setAttribute('class','ov');v.innerHTML='<defs><marker id="ah" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5z" class="mp"/></marker><filter id="bl" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
 const g=document.createElementNS(NS,'g');if(BLOOM_LINES&&!S.classList.contains('L'))g.setAttribute('filter','url(#bl)');v.appendChild(g);v.lg=g;S.appendChild(v);return v}
function mkGrid(x,s,n=5){const w=el('div','a gw',null,{left:x,top:'50%',width:s+'cqmin',height:s+'cqmin'});
 const im=pic('assets/digits/7.png','im',null,w);const g=el('div','gr',w);g.style.gridTemplate=`repeat(${n},1fr)/repeat(${n},1fr)`;
 return{w,im,cells:[...Array(n*n)].map(()=>el('div','',g))}}
function mkCirc(x,n,pitch,sz,txt){return[...Array(n)].map((_,i)=>{const c=el('div','a cr',null,{left:x,top:`calc(50cqh + ${(i-(n-1)/2)*pitch}cqmin)`,width:sz+'cqmin',height:sz+'cqmin',fontSize:sz*.58+'cqmin'});if(txt)c.textContent=i;return c})}
function ln(v,a,b,cls){const l=document.createElementNS(NS,'line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('class',cls);(v.lg||v).appendChild(l);return l}
/* every connection has a weight: it sets both thickness and brightness. Most are small; deterministic so a slide looks the same each visit */
const wt=(i,j)=>{const h=Math.sin((i+1)*12.9898+(j+1)*78.233)*43758.5453;return Math.pow(h-Math.floor(h),2.2)*.6};
const wire=(v,A,B,cls)=>A.map((a,i)=>B.map((b,j)=>{const l=ln(v,ctr(a),ctr(b),cls);l.style.setProperty('--w',wt(i,j).toFixed(3));return l}));
function net(o){const big=o.big,G=mkGrid(big?'26cqw':'17cqw',big?56:30),v=svg();
 const D=mkCirc(big?'84cqw':'83cqw',10,big?8.6:7,big?6.8:5.4,1);
 const H=o.hid?mkCirc('50cqw',6,12,8,0):null;let W=null,W2=null;
 if(o.cls){if(H){W=wire(v,G.cells,H,o.cls);W2=wire(v,H,D,o.cls)}else W=wire(v,G.cells,D,o.cls)}
 return{G,D,H,W,W2,v}}
const CORN=[0,4,24,20];
function killPulses(n,fade){const g=n.pg;n.pg=null;if(!g)return;if(fade){g.style.transition='opacity .6s';g.style.opacity=0;T(()=>g.remove(),700)}else g.remove()}
/* small lights travelling cell -> digit along the highlighted lines */
function pulses(n,L){killPulses(n,0);const g=document.createElementNS(NS,'g'),d=1.8;n.pg=g;n.v.appendChild(g);
 L.forEach(([l,col],q)=>[0,1].forEach(h=>{const b=`-${q*.45+h*d/2}s`,c=document.createElementNS(NS,'circle'),m=document.createElementNS(NS,'animateMotion'),o=document.createElementNS(NS,'animate');
  c.setAttribute('r',10);c.setAttribute('fill',col);c.style.filter=`drop-shadow(0 0 7px ${col})`;
  m.setAttribute('path',`M${l.getAttribute('x1')} ${l.getAttribute('y1')}L${l.getAttribute('x2')} ${l.getAttribute('y2')}`);
  o.setAttribute('attributeName','opacity');o.setAttribute('values','0;1;1;0');o.setAttribute('keyTimes','0;.12;.88;1');
  [m,o].forEach(a=>{a.setAttribute('dur',d+'s');a.setAttribute('begin',b);a.setAttribute('repeatCount','indefinite');c.appendChild(a)});g.appendChild(c)}))}
function apply(n,lv){n.D[7].classList.toggle('lit',lv>=2&&lv<5);
 n.W.forEach((row,i)=>row.forEach((l,j)=>{let c='ln';
  if(lv==0)c+=' z';else if(lv>=2){const k=CORN.includes(i)&&j==7&&lv<5;
   c+=k?(lv==2?' hi':i==20?(lv==4?' r':' hi'):' g'):' dim'}
  l.setAttribute('class',c);
  if(CORN.includes(i)&&j==7&&lv>=2)l.style.setProperty('--w',i==20?.95:1)}));
 if(!n.nop&&lv>=2&&lv<5)pulses(n,CORN.map(i=>[n.W[i][7],lv==2?'#fff':i==20?(lv==4?RED:'#fff'):GREEN]));else killPulses(n,0)}
function seq(a,b,np){const n=net({big:1,cls:'ln'});n.nop=np;apply(n,a);if(a!=b)T(()=>apply(n,b),600);return n}
function shift(n,anim){const im=n.G.im,mv=()=>{im.style.translate='3.5cqmin -2.2cqmin';im.style.rotate='11deg'};

 if(anim){im.style.transition='translate 1.3s ease-in-out,rotate 1.3s ease-in-out';T(mv,700);T(dk,1500)}else{mv();dk()}}

/* ---------- middle-layer shapes -> blobs ---------- */
const SH=[[20,6,20,12,20,16,20,20,20,24,20,28,20,34],[6,20,12,20,16,20,20,20,24,20,28,20,34,20],[8,32,13,27,16,24,20,20,24,16,27,13,32,8],
 [20,6,36,6,36,34,20,34,4,34,4,6,20,6],[8,32,8,12,14,8,20,8,26,8,32,12,32,32],[10,12,14,4,30,6,28,16,27,24,14,28,10,34]];

const NT={
0:[`בכיתה א', מאוד התרגשתי כשקנו את הציוד. אחד הדברים שקניתי הוא מחברת ציורים. לא ידעתי לצייר, אז עשיתי שטויות. בין השאר איקס עיגול. היום ננקום את נקמת דם איתן-מכיתה-א על כל היריבים שהוא הפסיד להם באיקס-עיגול.`],
1:[`להראות את המערכת: הקופסאות השונות והחרוזים, ואיך יעשו בה משחק.`],
4:[`לעשות דוגמא של משחק "רע". מכונה בוחרת אקראית לגמרי, ככה שבני אדם יכולים פשוט לנצח ב - 3 מהלכים. **(לשתף קהל? מרגיש שכדאי, אבל אולי מסובך טכנית)**`],
9:[`המכונה הפסידה.`],
10:[`אז המהלכים האלו הם מהלכים לא טובים, ולא כדאי לעשות אותם.`],
11:[`אז נוציא אותם.`],
12:[`עכשיו משחק טוב: המכונה מצליחה לנצח. **(לחשוב על דרך שבה לנצח באיקס-עיגול יראה אמין. אפשר לקשר לסיפור של כיתה א' כדי לפצות על הטיפשות)**`],
18:[`המכונה ניצחה.`],
19:[`זה דבר שאנחנו רוצים שיקרה,`],
20:[`אז נוסיף עוד מהמהלכים שגרמו לזה.`],
21:[`לאט לאט, על ידי מקל וגזר, המכונה פשוט לומדת אסטרטגיות, לגמרי לבד.`],
25:[`לדוגמא, תמיד להתחיל באמצע.`],
28:[`עוד בעיה שהייתה לאיתן בכיתה א', זה שכתב היד שלו היה מאוד גרוע.`],
29:[`אז נמשיך במסע של לעזור לאיתן-מכיתה-א' עם כל מי שצחק על הכתב שלו, ונבנה מכונה שדווקא כן יכולה לזהות את הספרות שהוא כותב.`],
30:[`אנחנו עכשיו מדברים במכונות, אז כדאי לעשות את זה קצת יותר ברור.`],
31:[`יש לנו רשימה של פיקסלים, ורשימה של ספרות, וקופסה שחורה באמצע. אנחנו רוצים שאיכשהו, מהמידע של הפיקסלים נגיע לאחת הספרות.`],
32:[`טוב, אנחנו יודעים איך עושים את זה: מחברים הכל, מקבלים שטויות, ולאט לאט מלמדים. אם בדוגמא מסויימת יש פיקסל, אנחנו רוצים לומר שהוא *קשור חיובית* למספר הזה. אם לא, *קשור שלילית*. נחזק את מה שאנחנו רוצים, ונחליש את מה שלא.`],
33:[`לדוגמא, נסתכל על המספר 7.`],
34:[`אנחנו רוצים שהמכונה תלמד שדברים באיזור הכללי של שלוש מהפינות קשורים ל7, הם מרמזים ש - 7 קורה,`],
35:[`ושדברים בפינה האחרת אומרים להפך.`,`זה באמת יכול לפעול במידה מסויימת. אבל לא מאוד טוב. הבעייה היא, שלומדים תמונה, ולא סימנים.`],
36:[`אם המספר טיפה זז, או טיפה על הצד, הכל נהרס.`],
37:[`אנחנו רוצים ללמוד את הסימן עצמו, לא את איך שאנחנו ציירנו אותו.`],
38:[`איך נעשה את זה? כמו כל דבר שאנחנו יודעים, נלמד מהגננת בגן חובה. יש את החוברות האלה, שלומדים לצייר ספרות, שלב אחרי שלב.`,`אז אולי, כמו שאנחנו למדנו ש - 2 זה קשת ואז נכנס פנימה ואז קו, שגם בינה מלאכותית תלמד ככה.`],
39:[`אז אנחנו רוצים 2 שלבים, מפרקים את המשימה הקשה לשתי משימות קלות: קודם, לזהות מבנים: קו, עיגול, קשת. אחרי זה, מכונה שמהמבנים האלה יודעת איזה מספר זה, לא מהציור עצמו.`],
40:[`אז אנחנו רוצים להוסיף עוד שלב באמצע: עצירה לחשוב. עוד שכבה.`],
41:[`עכשיו, אנחנו לא יודעים שזה באמת מה שקורה. אנחנו בעצם הכנסנו למכונה עוד שכבה, לזהות מבנים, ולהרכיב משהו מהמבנים האלו. זה לא בהכרח אותם מבנים כמו שאינטואיטיביים לנו: זה מה שהמכונה תלמד.`],
41:[`אנחנו לא מתכנתים את זה: אנחנו מכניסים את השכבה באמצע, נותנים לבינה המלאכותית לעשות את השלב הזה, את הזיהוי תבניות, אבל מה שבדיוק קורה זה לפי זיהוי התבניות, עם מקל וגזר מהדוגמאות שלנו, כמו שראינו עד עכשיו.`],
42:[`בעיה אחרונה שהייתה לאיתן-מכיתה-א' (צריך להיזהר לא לעשות יותר מדי גמילות חסדים ביום אחד), זה שהוא דיבר שטויות (יש שאומרים שזה ככה עד היום). ננסה ליצור מכונה שתתקן את זה, ושתדבר בצורה קוהרנטית.`,
 `איך מתחילים בכלל? איך מבינים שפה?`,
 `נעשה כמו מקודם: נחלק לשכבות. נעשה כל פעם בעיה קטנה של הבנת מבנים, ונתקדם.`,
 `מקודם, עשינו 3 שכבות, ויכולנו לעקוב אחרי זה ולתת משמעות, עכשיו, זו בעיה יותר מסובכת, אז לא באמת נוכל לדעת. פשוט מחלקים ונותנים לזה ללמוד תבניות לעקוב אחריהן. אם כל שכבה היא בניין, זה יהיה מגדל אייפל.`,
 `אבל זה אותו עניין של למידה. פשוט יותר שכבות שהן גם יותר מסובכות.`],
43:[`בשביל לנחש את המילה הבאה, אי אפשר סתם לאמן על משפטים. שפה לא עובדת ככה.`,
 `צריך גם הקשר, וגם ידע חיצוני. גם להוסיף משהו למילה, וגם שהמילים ישפיעו אחת על השנייה.`,
 `שפה לא עובדת ככה. בעצם, יש לנו מרחב, שכל כיוון הוא מילה, ואז אפשר לחבר מילים וללכת בכיוון של מילים מסוימות, ויש לזה משמעות, אבל לא חייבים להבין את זה.`],
44:[`בשביל ללמד מכונה, צריך פשוט לתת לה הרבה אופציות (כל החרוזים בקופסאות), ולהוריד את האופציות הרעות ולחזק את הטובות.`,
 `כשיש בעיה קשה מדי, פשוט מפצלים אותה לבעיות קלות יותר.`,
 `**Think of a good ending**.`]
